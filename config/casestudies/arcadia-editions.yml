  - [Arcadia Editions: An AsyncAPI Governance Case Study](https://ivangsa.com/articles/arcadia/015-arcadia-editions-asyncapi-governance-case-study), the companion article, with how to set up provisioning and SDK generation in your own services
  - The five microservices, such as [orders-checkout-service-java](https://github.com/arcadia-editions/orders-checkout-service-java) (Spring Cloud Stream) and [payments-processing-service-java](https://github.com/arcadia-editions/payments-processing-service-java) (Spring Kafka): clone one and run `mvn compile` to see the SDK generated from both contracts
  - [arcadia-editions-microservices-compose](https://github.com/arcadia-editions/arcadia-editions-microservices-compose) to run the whole Place Order flow locally
  - [The arcadia-editions GitHub organization](https://github.com/arcadia-editions), starting with [arcadia-editions-architecture](https://github.com/arcadia-editions/arcadia-editions-architecture)
  - [Run Kafka provisioning on your laptop](https://github.com/arcadia-editions/api-product-workflows/blob/main/docs/run-kafka-provisioning-locally.md), from the `orders-checkout-api` contracts to Confluent Cloud
  - [The Arcadia Event Catalog](https://arcadia-editions.github.io/arcadia-event-catalog/)
  - Talk: [Stop API Drift: Generate Java from AsyncAPI](https://youtu.be/AwZoXxyQj9o)
  - Talk: [Stop API Drift: Provision Kafka from AsyncAPI](https://youtu.be/S8Sknrdl1jM)
  - The article series on [ivangsa.com](https://ivangsa.com), from [Meet Arcadia Editions](https://ivangsa.com/articles/arcadia/001-meet-arcadia-editions) to [Generate OpenAPI and AsyncAPI from ZDL](https://ivangsa.com/articles/arcadia/009-dsl-modeling-for-apis-generate-openapi-and-asyncapi-from-zdl), [Treat Your Domain Models and APIs as Products](https://ivangsa.com/articles/arcadia/010-treat-your-service-apis-as-products), [The Architecture Manifest](https://ivangsa.com/articles/arcadia/011-master-yaml-architecture-manifest), [The Architecture Manifest Meets EventCatalog](https://ivangsa.com/articles/arcadia/012-arcadia-architecture-manifest-meets-event-catalog), [Provisioning Infrastructure with Terraform from AsyncAPI](https://ivangsa.com/articles/arcadia/013-infrastructure-provisioning-asyncapi-terraform) and [AsyncAPI Governance Built to Last](https://ivangsa.com/articles/arcadia/014-async-api-governance-built-to-last)
