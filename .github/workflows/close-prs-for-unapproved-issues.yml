# Purpose of this workflow is to automatically close PRs that reference
# issues still carrying the 'Awaiting Approval' label, preventing work
# on issues that have not yet been approved by a maintainer.
# PRs without a linked issue are kept open and tagged with 'no-issue-linked'.
# PRs from AsyncAPI maintainers (config/MAINTAINERS.json) are exempt and
# receive a 'Maintainer\'s PR' label instead.

name: Close PRs linked to unapproved issues

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened

jobs:
  close-if-unapproved:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MAINTAINERS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: config/MAINTAINERS.json
          sparse-checkout-cone-mode: false

      - name: Check linked issue and close PR if unapproved
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const fs = require('fs');
            const prAuthor = context.payload.pull_request.user.login;
            const prNumber = context.payload.pull_request.number;

            // ---------- helpers ----------
            async function ensureLabel(name, color, description) {
              const { data: repoLabels } = await github.rest.issues.listLabelsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });

              if (!repoLabels.some(l => l.name === name)) {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color,
                    description,
                  });
                } catch (e) {
                  if (e.status !== 422) throw e;
                }
              }
            }

            // ---------- bot bypass ----------
            const botAuthors = ['asyncapi-bot', 'dependabot[bot]', 'dependabot-preview[bot]', 'github-actions[bot]', 'asyncapi-bot-eve'];
            if (botAuthors.includes(prAuthor)) {
              console.log(`PR opened by automation account '${prAuthor}'. Skipping issue-link enforcement.`);
              return;
            }

            // ---------- parse MAINTAINERS for maintainer bypass ----------
            const maintainersData = JSON.parse(fs.readFileSync('./config/MAINTAINERS.json', 'utf8'));
            const maintainers = maintainersData
              .map(m => (m.github || '').toLowerCase())
              .filter(Boolean);

            core.info(`Maintainers from config/MAINTAINERS.json: ${maintainers.length} maintainers loaded`);

            if (maintainers.includes(prAuthor.toLowerCase())) {
              console.log(`PR #${prNumber} opened by maintainer @${prAuthor}. Skipping issue-link enforcement.`);

              // Add "Maintainer's PR" label
              const maintainerLabel = "Maintainer's PR";
              await ensureLabel(maintainerLabel, '5319e7', 'PR opened by an AsyncAPI maintainer');

              await github.rest.issues.addLabels({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: [maintainerLabel],
              });

              return;
            }

            // ---------- check for issue references ----------
            const prBody = context.payload.pull_request.body || '';

            const issuePattern = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+#(\d+)/gi;
            const matches = [...prBody.matchAll(issuePattern)];

            const noIssueLabel = 'no-issue-linked';

            if (matches.length === 0) {
              console.log(`No linked issues found in PR #${prNumber} body. Adding '${noIssueLabel}' label and keeping PR open.`);

              await ensureLabel(noIssueLabel, 'EDEDED', 'PR does not have a linked issue');

              await github.rest.issues.addLabels({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: [noIssueLabel],
              });

              return;
            }

            // If an issue IS linked, ensure 'no-issue-linked' label is removed if it was previously added (e.g., on PR edit)
            const { data: prLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            if (prLabels.some(l => l.name === noIssueLabel)) {
              console.log(`Issue reference found, removing '${noIssueLabel}' label from PR #${prNumber}...`);
              await github.rest.issues.removeLabel({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: noIssueLabel,
              });
            }

            // ---------- check linked issues for approval ----------
            const awaitingLabel = 'Awaiting Approval';

            for (const match of matches) {
              const issueNumber = parseInt(match[1], 10);
              console.log(`Checking issue #${issueNumber} for '${awaitingLabel}' label...`);

              try {
                const { data: labels } = await github.rest.issues.listLabelsOnIssue({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                });

                if (labels.some(l => l.name === awaitingLabel)) {
                  console.log(`Issue #${issueNumber} still has '${awaitingLabel}'. Closing PR #${prNumber}.`);

                  await github.rest.issues.createComment({
                    issue_number: prNumber,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: `🚫 This PR has been automatically closed because the linked issue #${issueNumber} has not been approved yet.\n\nPlease wait for a maintainer to approve the issue with the \`/approve\` command before opening a PR.`,
                  });

                  await github.rest.pulls.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: prNumber,
                    state: 'closed',
                  });

                  return;
                }
              } catch (error) {
                if (error.status === 404) {
                   await github.rest.issues.createComment({
                    issue_number: prNumber,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: `🚫 This PR references issue #${issueNumber}, which does not exist. Please correct the linked issue reference.`,
                  });
                  await github.rest.pulls.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: prNumber,
                    state: 'closed',
                  });
                  return;
                }
                core.setFailed(`Could not verify labels for issue #${issueNumber}: ${error.message}`);
                return;
              }
            }

            console.log('All linked issues are approved or no matching label found. PR stays open.');
