# Purpose of this workflow is to automatically add the 'Awaiting Approval' label
# to every newly opened issue so maintainers can triage before work begins.
# Issues opened by core maintainers (from the CODEOWNERS catch-all line) are
# automatically approved and triaged instead.

name: Add 'Awaiting Approval' label on new issues

on:
  issues:
    types:
      - opened

jobs:
  label-new-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CODEOWNERS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: CODEOWNERS
          sparse-checkout-cone-mode: false

      - name: Label new issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ACTOR: ${{ github.actor }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const fs = require('fs');
            const actor = process.env.ACTOR;

            // ---------- helpers ----------
            async function ensureLabel(name, color, description) {
              const { data: repoLabels } = await github.rest.issues.listLabelsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });

              if (!repoLabels.some(l => l.name === name)) {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color,
                    description,
                  });
                } catch (e) {
                  if (e.status !== 422) throw e; // 422 = already exists (race)
                }
              }
            }

            // ---------- parse CODEOWNERS ----------
            const codeowners = fs.readFileSync('./CODEOWNERS', 'utf8');
            const lines = codeowners.split('\n');

            const catchAllLine = lines.find(
              line => !line.startsWith('#') && line.trim().startsWith('* ')
            );

            if (!catchAllLine) {
              core.setFailed('Could not find the catch-all `*` line in CODEOWNERS');
              return;
            }

            const regex = /@([a-zA-Z0-9_-]+)/g;
            const matches = catchAllLine.match(regex);
            const maintainers = matches
              ? matches
                  .map(m => m.substring(1))
                  .filter(name => !name.includes('bot'))
              : [];

            core.info(`Core maintainers from CODEOWNERS: ${maintainers.join(', ')}`);

            const isMaintainer = maintainers.includes(actor);

            if (isMaintainer) {
              // ---------- auto-approve maintainer issues ----------
              const approvedLabel = 'Approved Issue';
              const triagedLabel = 'triaged';

              await ensureLabel(approvedLabel, '0e8a16', 'Issue has been approved by a maintainer and is ready for work');
              await ensureLabel(triagedLabel, '0052cc', 'Issue has been reviewed and discussed');

              console.log(`Issue #${context.issue.number} opened by maintainer @${actor}. Auto-approving and triaging.`);
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: [approvedLabel, triagedLabel],
              });
            } else {
              // ---------- add Awaiting Approval for non-maintainers ----------
              const awaitingLabel = 'Awaiting Approval';
              await ensureLabel(awaitingLabel, 'fbca04', 'Issue awaiting maintainer approval before work can begin');

              console.log(`Adding label '${awaitingLabel}' to issue #${context.issue.number}...`);
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: [awaitingLabel],
              });
            }
