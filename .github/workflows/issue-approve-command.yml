# Purpose of this workflow is to allow AsyncAPI maintainers (listed in
# config/MAINTAINERS.json) to approve issues via the /approve command,
# swapping the 'Awaiting Approval' label for 'Approved Issue' + 'triaged'
# and posting an instruction comment for contributors.

name: Issue /approve command

on:
  issue_comment:
    types:
      - created

jobs:
  approve-issue:
    if: >
      !github.event.issue.pull_request &&
      github.event.issue.state != 'closed' &&
      startsWith(github.event.comment.body, '/approve')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout MAINTAINERS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: config/MAINTAINERS.json
          sparse-checkout-cone-mode: false

      - name: Check authorization and approve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ACTOR: ${{ github.actor }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const fs = require('fs');
            const actor = process.env.ACTOR;

            const incomingComment = (context.payload.comment.body || '').trim();
            if (!/^\/approve(\s.*)?$/is.test(incomingComment)) {
              return;
            }

            // ---------- parse MAINTAINERS ----------
            const maintainersData = JSON.parse(fs.readFileSync('./config/MAINTAINERS.json', 'utf8'));
            const approvers = maintainersData
              .map(m => (m.github || '').toLowerCase())
              .filter(Boolean);

            core.info(`Maintainers from config/MAINTAINERS.json: ${approvers.length} maintainers loaded`);

            // ---------- authorization check ----------
            if (!approvers.includes(actor.toLowerCase())) {
              const commentText = `❌ @${actor} is not authorized to use the \`/approve\` command.\nOnly AsyncAPI maintainers can approve issues.`;

              console.log(`❌ @${actor} made an unauthorized attempt to use /approve.`);
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentText,
              });
              return;
            }

            // ---------- already approved? ----------
            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            if (currentLabels.some(l => l.name === 'Approved Issue')) {
              console.log('Issue already approved, skipping.');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `ℹ️ @${actor} this issue is already approved.`,
              });
              return;
            }

            // ---------- swap labels ----------
            // Add Approved Issue and triaged FIRST, then remove Awaiting Approval.
            // This order prevents a gap where the issue has neither label
            // if the add fails after the remove.
            const approvedLabel = 'Approved Issue';
            const triagedLabel = 'triaged';

            const { data: repoLabels } = await github.rest.issues.listLabelsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            async function ensureLabel(name, color, description) {
              if (!repoLabels.some(l => l.name === name)) {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color,
                    description,
                  });
                } catch (e) {
                  if (e.status !== 422) throw e;
                }
              }
            }

            await ensureLabel(approvedLabel, '0e8a16', 'Issue has been approved by a maintainer and is ready for work');
            await ensureLabel(triagedLabel, '0052cc', 'Issue has been reviewed and discussed');

            console.log(`Adding labels '${approvedLabel}' and '${triagedLabel}' to issue #${context.issue.number}...`);
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: [approvedLabel, triagedLabel],
            });

            const awaitingLabel = 'Awaiting Approval';
            if (currentLabels.some(l => l.name === awaitingLabel)) {
              console.log(`Removing label '${awaitingLabel}'...`);
              await github.rest.issues.removeLabel({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: awaitingLabel,
              });
            }

            // ---------- post contribution instructions ----------
            const commentBody = `👋 Thanks for your patience. This issue has been reviewed and is ready to be worked on.

            **Before you start:**

            - Comment below to let others know you're working on it (avoids duplicate work)
            - Read our [CONTRIBUTING.md](../blob/master/CONTRIBUTING.md) if you haven't already
            - Fork the repo, create a feature branch, and open a draft PR early

            _Approved by @${actor}_`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody,
            });
